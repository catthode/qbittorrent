name: Build theme

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install disposable validation tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick qbittorrent qtbase5-dev-tools python3-pyqt5 scrot wmctrl xvfb
      - name: Build theme
        run: ./build.sh
      - name: Inspect compiled Qt resources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PyQt5.QtCore import QDir, QFile, QResource

          artifact = Path("dist/catthode.qbtheme")
          assert artifact.is_file() and artifact.stat().st_size > 0
          assert QResource.registerResource(str(artifact.resolve()))
          entries = set(QDir(":/uitheme").entryList())
          assert {"config.json", "stylesheet.qss"}.issubset(entries), entries
          assert QFile(":/uitheme/config.json").size() > 100
          assert QFile(":/uitheme/stylesheet.qss").size() > 100
          print("Catthode qBittorrent resource validation passed")
          PY
      - name: Smoke-test in disposable qBittorrent session
        run: |
          mkdir -p "$HOME/.config/qBittorrent"
          THEME_PATH="$(pwd)/dist/catthode.qbtheme"
          printf '%s\n' \
            '[LegalNotice]' \
            'Accepted=true' \
            '[Preferences]' \
            "General\\CustomUIThemePath=$THEME_PATH" \
            'General\UseCustomUITheme=true' \
            > "$HOME/.config/qBittorrent/qBittorrent.conf"
          export SCREENSHOT_PATH="$(pwd)/dist/catthode-qbittorrent.png"
          xvfb-run -a sh -c '
            qbittorrent --no-splash &
            app_pid=$!
            for attempt in $(seq 1 20); do
              wmctrl -l | grep -qi qbittorrent && break
              kill -0 "$app_pid"
              sleep 1
            done
            wmctrl -l | grep -qi qbittorrent
            sleep 2
            scrot "$SCREENSHOT_PATH"
            kill "$app_pid"
            wait "$app_pid" || true
          '
          test -s "$SCREENSHOT_PATH"
          test "$(identify -format '%k' "$SCREENSHOT_PATH")" -gt 16
      - uses: actions/upload-artifact@v4
        with:
          name: catthode-qbittorrent
          path: |
            dist/catthode.qbtheme
            dist/catthode-qbittorrent.png
