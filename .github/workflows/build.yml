name: Build theme

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt resource compiler
        run: sudo apt-get update && sudo apt-get install -y qtbase5-dev-tools
      - name: Build theme
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: catthode-qbittorrent
          path: dist/catthode.qbtheme
